# Theme module config.
#
# This file is merged into every site that imports the theme, so it holds only
# what a consuming site should genuinely inherit. Demo values -- baseURL, title,
# params, menus -- live in exampleSite/hugo.toml, because anything set here
# silently becomes a fallback for consumers that don't define it themselves.
#
# Deliberately no [[module.mounts]]: declaring even one mount replaces Hugo's
# entire default set, and the defaults are already correct now that the theme
# ships no content/ directory.

# Hugo ships no built-in media type for .woff2 (only font/ttf and font/otf), so
# resources.Get on a font falls back to the host's mime database -- present on
# macOS, often absent on slim Linux CI images. Register it explicitly.
[mediaTypes]
  [mediaTypes.'font/woff2']
    suffixes = ['woff2']
  [mediaTypes.'font/woff']
    suffixes = ['woff']

[module]
[module.hugoVersion]
  extended = false
  min = '0.146.0'
