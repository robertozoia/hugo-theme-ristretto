baseURL = 'https://example.org/'
locale = 'en-US'
title = 'My New Hugo Site'

[module]
[[module.imports]]
path = "github.com/robertozoia/hugo-theme-ristretto"

# Theme parameters
[params]
  description = 'A personal blog about technology and ideas'
  # `{year}` is replaced with the current year when the site is built.
  copyright = '© {year} My New Hugo Site. All rights reserved.'

  # Email for reply functionality
  reply_to_email = 'hello@example.org'

  # Home page: the latest post leads the page. Set to true to render it in full;
  # false (the default) shows its first two paragraphs and a "Read more ->" link.
  home_latest_post_full = false

  # Categories barred from that featured slot. They still appear in the
  # "Recent Articles" grid below it -- only `notes` is kept out of that.
  # An explicit empty list means nothing is excluded.
  home_featured_exclude_categories = ['notes']

  # A section whose _index.md sets no `categories` lists every post, minus the
  # categories named here -- use it for one merged listing in place of several
  # topic sections. Sections that do set `categories` keep their own include
  # filter and ignore this.
  section_exclude_categories = []

  # Mailchimp newsletter integration (optional)
  mailchimp_user_id = 'your_mailchimp_user_id'
  mailchimp_audience_id = 'your_mailchimp_audience_id'

  # GoatCounter analytics (optional)
  # goatcounter_code = 'your_goatcounter_code'

  # Author information (used in RSS feed)
  [params.author]
    name = 'Your Name'
    email = 'you@example.com'

# Main navigation menu
[menus]
[[menus.main]]
  name = 'Home'
  pageRef = '/'
  weight = 10

[[menus.main]]
  name = 'Posts'
  pageRef = '/posts'
  weight = 20

[[menus.main]]
  name = 'Categories'
  identifier = 'categories'
  url = '/categories'
  weight = 30

[[menus.main]]
  name = 'Tags'
  pageRef = '/tags'
  weight = 40

# Example: Search icon in menu
# [[menus.main]]
#   name = 'Search'
#   url = '/search'
#   weight = 50
#   [menus.main.params]
#     icon = true

# Example: Button-style menu item
# [[menus.main]]
#   name = 'Subscribe'
#   url = '/subscribe'
#   weight = 60
#   [menus.main.params]
#     button = true

# Dropdown items: any main-menu entry naming another entry's identifier as its
# `parent` is nested under it, and that parent renders as a dropdown. Define as
# many dropdowns as you need this way.
[[menus.main]]
  name = 'Technology'
  parent = 'categories'
  url = '/categories/technology'
  weight = 10

[[menus.main]]
  name = 'Programming'
  parent = 'categories'
  url = '/categories/programming'
  weight = 20

[[menus.main]]
  name = 'Design'
  parent = 'categories'
  url = '/categories/design'
  weight = 30

# Footer menu
[[params.footerMenu]]
  name = 'About'
  url = '/about'

[[params.footerMenu]]
  name = 'Privacy'
  url = '/privacy'

[[params.footerMenu]]
  name = 'RSS'
  url = '/index.xml'
  external = true
