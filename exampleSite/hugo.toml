baseURL = 'https://example.org/'
locale = 'en-US'
title = 'My New Hugo Site'

[module]
[[module.imports]]
path = "github.com/robertozoia/hugo-theme-ristretto"

# Theme parameters
[params]
  description = 'A personal blog about technology and ideas'
  # `{year}` is replaced with the current year when the site is built.
  copyright = '© {year} My New Hugo Site. All rights reserved.'

  # Email for reply functionality
  reply_to_email = 'hello@example.org'

  # Mailchimp newsletter integration (optional)
  mailchimp_user_id = 'your_mailchimp_user_id'
  mailchimp_audience_id = 'your_mailchimp_audience_id'

  # KipuThread comments (optional)
  # show_comments = true
  # kiputhread_blog_id = 'your-blog-id'

  # GoatCounter analytics (optional)
  # goatcounter_code = 'your_goatcounter_code'

  # Author information (used in RSS feed)
  [params.author]
    name = 'Your Name'
    email = 'you@example.com'

# Main navigation menu
[menus]
[[menus.main]]
  name = 'Home'
  pageRef = '/'
  weight = 10

[[menus.main]]
  name = 'Posts'
  pageRef = '/posts'
  weight = 20

[[menus.main]]
  name = 'Categories'
  identifier = 'categories'
  url = '/categories'
  weight = 30

[[menus.main]]
  name = 'Tags'
  pageRef = '/tags'
  weight = 40

# Example: Search icon in menu
# [[menus.main]]
#   name = 'Search'
#   url = '/search'
#   weight = 50
#   [menus.main.params]
#     icon = true

# Example: Button-style menu item
# [[menus.main]]
#   name = 'Subscribe'
#   url = '/subscribe'
#   weight = 60
#   [menus.main.params]
#     button = true

# Categories dropdown menu items
[[menus.categories]]
  name = 'Technology'
  url = '/categories/technology'
  weight = 10

[[menus.categories]]
  name = 'Programming'
  url = '/categories/programming'
  weight = 20

[[menus.categories]]
  name = 'Design'
  url = '/categories/design'
  weight = 30

# Footer menu
[[params.footerMenu]]
  name = 'About'
  url = '/about'

[[params.footerMenu]]
  name = 'Privacy'
  url = '/privacy'

[[params.footerMenu]]
  name = 'RSS'
  url = '/index.xml'
  external = true
